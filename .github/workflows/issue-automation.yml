name: Issue Automation

on:
  issues:
    types: [opened]

jobs:
  validate-spec-request:
    if: contains(github.event.issue.labels.*.name, 'spec-request')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Validate spec request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const body = context.payload.issue.body || '';
            const urlMatch = body.match(/### Spec URL\s*\n\n(.+)/);
            const specUrl = urlMatch ? urlMatch[1].trim() : '';

            if (!specUrl || specUrl === '_No response_') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'No spec URL provided. If you have a direct link to the spec file (YAML, JSON, SDL, proto), adding it here will help us process this request faster.'
              });
              return;
            }

            let parsed;
            try {
              parsed = new URL(specUrl);
            } catch {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'The spec URL is not a valid absolute URL. Please provide a direct public HTTPS link.'
              });
              return;
            }

            if (
              parsed.protocol !== 'https:' ||
              parsed.username ||
              parsed.password ||
              !parsed.hostname
            ) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'The spec URL must be a direct public HTTPS link without embedded credentials.'
              });
              return;
            }

            // Do not fetch reporter-controlled URLs from a privileged Actions
            // runner. Maintainers can inspect the URL during normal triage.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'The spec URL has a valid HTTPS format. Thanks for including the direct link!'
            });
